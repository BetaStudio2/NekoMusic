# ---------------------------------------------------------
# 【检测来源：排除本地回环 IP】
# ---------------------------------------------------------
map $realip_remote_addr $is_local_connection {
    "127.0.0.1" "yes";
    "::1" "yes";
    default "no";
}
# 仅对搜索引擎 / 社交预览 / curl 等返回后端 SEO HTML；普通浏览器走前端 SPA
map $http_user_agent $seo_detail_bot {
    default 0;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*baiduspider 1;
    ~*bytespider 1;
    ~*yandexbot 1;
    ~*duckduckbot 1;
    ~*sogou 1;
    ~*360spider 1;
    ~*yisouspider 1;
    ~*petalbot 1;
    ~*applebot 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*slackbot 1;
    ~*discordbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*curl/ 1;
    ~*wget 1;
    ~*python-requests 1;
    ~*go-http-client 1;
    ~*headlesschrome 1;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 9999 default_server;
    listen [::]:9999 default_server;
    listen 9998 ssl default_server;
    listen 9998 quic default_server;
    listen [::]:9998 ssl default_server;
    listen [::]:9998 quic default_server;
    # ---------------------------------------------------------
    # 【1. 基础设置】
    # ---------------------------------------------------------
    server_name music.cnmsb.xin ipv6.cnmsb.xin 127.0.0.1;
    root /www/sites/music.cnmsb.xin/index;
    index index.html;
    client_max_body_size 500M;
    # ---------------------------------------------------------
    # 【2. 真实 IP 识别 & 强制 CDN 访问控制】
    # ---------------------------------------------------------
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # 默认状态：不允许访问
    set $block_this_request "yes";
    # 放行条件 A：如果请求头带了 ESA 的暗号
    if ($http_iscdn = "true" ) {
        set $block_this_request "no";
    }
    # 放行条件 B：如果是本地回环地址访问（服务器自用）
    if ($is_local_connection = "yes" ) {
        set $block_this_request "no";
    }
    # 切断绕过cdn的公网请求
    if ($block_this_request = "yes" ) {
        #return 444;
        # 滚开去下大文件去吧
        return 302 https://nbg1-speed.hetzner.com/10GB.bin;
    }
    # ---------------------------------------------------------
    # 【3. 跨域与预检】
    # ---------------------------------------------------------
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header Access-Control-Allow-Headers 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,X-Requested-With,Expires,If-Modified-Since,Pragma,Edge-Connect-Client-IP,iscdn' always;
    add_header Access-Control-Allow-Credentials true always;
    if ($request_method = 'OPTIONS' ) {
        return 204;
    }
    # ---------------------------------------------------------
    # 【4. 核心业务路径】
    # ---------------------------------------------------------
    # 动态 sitemap（后端生成，含首页 + 全部 /detail/{id}）
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:65535;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    # 音乐详情：真人浏览器 → index.html（Vue）；爬虫/curl → 后端 SEO HTML
    location ~ ^/detail/[0-9]+/?$ {
        error_page 418 = @detail_seo_backend;
        if ($seo_detail_bot) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }
    location @detail_seo_backend {
        proxy_pass http://127.0.0.1:65535$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    # ---------------------------------------------------------
    # 【5. SSL & 后端代理】
    # ---------------------------------------------------------
    access_log /www/sites/music.cnmsb.xin/log/access.log;
    error_log /www/sites/music.cnmsb.xin/log/error.log;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    http2 on;
    ssl_certificate /www/sites/music.cnmsb.xin/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/music.cnmsb.xin/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header Alt-Svc 'h3=":443"; ma=2592000';
    # ---------------------------------------------------------
    # 【6. 性能补丁】
    # ---------------------------------------------------------
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    keepalive_timeout 300s;
    client_body_buffer_size 128k;
    proxy_request_buffering off;
    include /www/sites/music.cnmsb.xin/proxy/*.conf;
}

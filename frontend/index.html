    <!--
      爬虫 / AI 抓取器由后端 StaticPageSeoFilter 直接返回服务端渲染的正文与 JSON-LD，
      浏览器看到的则是下方的 .app-splash 首屏（Vue 挂载后整段 #app 由应用替换）。
    -->
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #07060d;
        }

        #app {
            position: relative;
            min-height: 100vh;
        }

        .app-splash {
            position: fixed;
            inset: 0;
            z-index: 1000;
            box-sizing: border-box;
            display: grid;
            place-items: center;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            margin: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
            color: rgba(255, 255, 255, 0.92);
            background:
                radial-gradient(1200px 700px at 10% -10%, rgba(139, 92, 246, 0.35), transparent 55%),
                radial-gradient(900px 600px at 95% 10%, rgba(34, 211, 238, 0.18), transparent 50%),
                linear-gradient(180deg, #07060d, #0f1020 40%, #0a0a12 100%);
        }
        .app-splash__card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 32px 36px;
            max-width: min(360px, 100%);
            text-align: center;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(12, 11, 22, 0.88);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }
        .app-splash__spinner {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: #22d3ee;
            animation: app-splash-spin 0.85s linear infinite;
        }
        @keyframes app-splash-spin {
            to { transform: rotate(360deg); }
        }
        .app-splash__brand {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.12em;
        }
        .app-splash__hint {
            margin: 0;
            font-size: 0.88rem;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.58);
        }
        @media (prefers-reduced-motion: reduce) {
            .app-splash__spinner {
                animation: none;
                border-color: rgba(34, 211, 238, 0.45);
            }
        }
    </style>
</head>
<body>
    <div id="app">

            <div class="app-splash__card">

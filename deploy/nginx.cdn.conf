# =============================================================================
# NekoMusic - 生产部署 Nginx 参考配置（反向代理 + CDN 真实客户端 IP）
# =============================================================================
# 适用拓扑：CDN(Cloudflare/阿里云/腾讯云等) -> Nginx -> NekoMusic 后端(Jetty)
#
# 注意：本文件是「模板」，所有 <占位符> 都必须替换为你的真实值后再使用，严禁原样复制！
#
# =============================================================================
# 【使用方案】三选一，按前后端实际拓扑选择，并在下方对应位置填好占位符
# =============================================================================
#
# ── 方案 A · 纯直连（无 CDN、无反向代理）──────────────────────────────────
#   适用：后端直接暴露公网，或只有一层防火墙转发端口，前面没有任何代理。
#   做法：后端 config.yml 里设 network.trusted_client_ip_header: direct
#         （客户端 IP 一律取 socket 对端地址，忽略所有转发头，最抗污染）。
#   本 Nginx 模板【不适用/不需要】。若无论如何都用 nginx 反代，照最简做法：
#         见方案 B。
#
# ── 方案 B · 仅 Nginx 反代（无 CDN）───────────────────────────────────────
#   适用：Nginx 直接面对真实用户（用户 -> Nginx -> 后端）。
#   特点：此场景 nginx 的 $remote_addr 就是真实用户 IP，无需 real_ip 模块。
#   上手：后端 config.yml 用默认 X-Real-IP（不必改）；
#         下面 location / 里已写好 proxy_set_header X-Real-IP $remote_addr，直接可用；
#         但请【删除】或【注释掉】文件顶部的 set_real_ip_from / real_ip_header 两段
#         （没有 CDN 时不该启用 real_ip 模块）。
#
# ── 方案 C · CDN + Nginx 反代（本文档主体，下面已按此写好）─────────────────
#   适用：Cloudflare / 阿里云 / 腾讯云 等 CDN 挡在前面。
#   特点：nginx 的 $remote_addr 是 CDN 边缘 IP，必须用 real_ip 模块还原真实用户 IP，
#         否则评论归属地(geo) 会统统显示成 CDN 所在地区。
#   C1 - Cloudflare：不受信任的段填官方 CF IP，real_ip_header 用 CF-Connecting-IP（推荐）。
#   C2 - 阿里云/腾讯云/其它 CDN：不受信任的段填 CDN 回源 IP，
#        real_ip_header 用 X-Forwarded-For + real_ip_recursive on。
#   后端 config.yml 一律保持 network.trusted_client_ip_header: X-Real-IP（默认，不必改）。
#
# =============================================================================

# ── ① server_name：替换成你的域名 ─────────────────────────────────────────
server_name <YOUR_DOMAIN>;            # 例如 example.com

# ─────────────────────────────────────────────────────────────────────────────
# ② CDN 回源 IP 段 —— 仅【方案 C】需要。选 A / B 时把下面两块(#~#)整个删掉。
# 把 <CDN_ORIGIN_CIDR_1> 替换为你的 CDN 节点/回源 IP 段：
#   - Cloudflare(方案C1): 官方 IP 列表 https://www.cloudflare.com/ips/
#   - 阿里云/腾讯云等(方案C2): 控制台查"回源 IP / CDN 节点 IP"
# ─────────────────────────────────────────────────────────────────────────────
#~ set_real_ip_from <CDN_ORIGIN_CIDR_1>;   # 例如 173.245.48.0/20
#~ # set_real_ip_from <CDN_ORIGIN_CIDR_2>;  # 继续追加 CDN 节点段
#~ # set_real_ip_from <CDN_ORIGIN_CIDR_3>;
#~

# ─────────────────────────────────────────────────────────────────────────────
# ③ 真实用户 IP 来源头 —— 仅【方案 C】需要。按 CDN 类型放开其中一个：
#   - 方案C1 Cloudflare（推荐，单值、明确）：取消下面 CF-Connecting-IP 一行的注释。
#   - 方案C2 阿里云/腾讯云等（只有 X-Forwarded-For）：改为放开下面 X-Forwarded-For 两行。
# ─────────────────────────────────────────────────────────────────────────────
real_ip_header CF-Connecting-IP;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# ─────────────────────────────────────────────────────────────────────────────
# ④ 后端地址：替换成真实主机与端口（默认端口见 backend 的 config.yml，多为 65535）
# ─────────────────────────────────────────────────────────────────────────────
upstream neko_backend {
    server <BACKEND_HOST>:<BACKEND_PORT>;   # 例如 127.0.0.1:65535
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    http2 on;

    # ---- SSL（如有证书；无则省略 443，或交给 CDN 卸载 TLS）----
    # ssl_certificate     /etc/nginx/ssl/<YOUR_CERT>.pem;
    # ssl_certificate_key /etc/nginx/ssl/<YOUR_CERT>.key;

    server_name <YOUR_DOMAIN>;

    # 静态资源长缓存（前端 SPA / 媒体封面 / 图片，文件名带哈希）
    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|gif|svg|ico|webmanifest)$ {
        proxy_pass http://neko_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 其余全部代理到后端（前端 SPA、/api、/sitemap.xml、/llms.txt、robots.txt 等）
    location / {
        proxy_pass http://neko_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 覆盖写入"真实用户 IP"，客户端不可伪造（配合后端 network.trusted_client_ip_header）。
        # 方案 B 下 $remote_addr 即真实用户 IP；方案 C 下经 real_ip 模块还原后也是真实用户 IP。
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 透传真实 UA 用于后端识别爬虫
        proxy_set_header User-Agent $http_user_agent;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        client_max_body_size  200m;   # 与后端上传大小上限一致
    }

    # 安全头说明：X-Content-Type-Options / Referrer-Policy / X-Frame-Options / Permissions-Policy
    # 由后端 SecurityHeadersFilter 统一为所有响应下发；此处仅补 HSTS（后端走明文 HTTP，不宜发）。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # /robots.txt、/sitemap.xml、/llms.txt 由后端自动生成，走上面的普通代理即可，爬虫可正常访问。
}
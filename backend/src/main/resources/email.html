<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NekoMusic - 雫の共鸣协议</title>
    <style>
        body {
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 主容器：雫蓝渐变边框与毛玻璃质感 */
        .container {
            max-width: 580px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 40px 10px 40px 10px; /* 不规则圆角更具设计感 */
            border: 2px solid #a2d2ff;
            box-shadow: 0 20px 60px rgba(162, 210, 255, 0.3);
            overflow: hidden;
            position: relative;
        }

        /* 顶部华丽装饰区 */
        .header-art {
            background: linear-gradient(135deg, #bde0fe 0%, #ffc8dd 100%);
            height: 120px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG 绘制：猫耳装饰 */
        .neko-ears {
            position: absolute;
            top: -20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        /* 标题设计 */
        .title-group h1 {
            color: #ffffff;
            margin: 0;
            font-size: 26px;
            letter-spacing: 5px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            font-weight: 900;
        }

        /* 内容区布局 */
        .main-body {
            padding: 40px;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 30L35 25L30 20L25 25Z' fill='%23bde0fe' fill-opacity='0.2'/%3E%3C/svg%3E");
            color: #5b7083;
        }

        .user-greet {
            font-size: 20px;
            color: #4895ef;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        /* 验证码卡片：精致的内嵌式设计 */
        .code-card {
            margin: 35px 0;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            border: 1px solid #e0f2fe;
            box-shadow: inset 0 0 20px rgba(189, 224, 254, 0.2), 0 10px 20px rgba(0,0,0,0.05);
            position: relative;
        }

        .code-display {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 52px;
            font-weight: bold;
            background: linear-gradient(to right, #4895ef, #4cc9f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 12px;
        }

        /* 底部信息栏 */
        .footer-info {
            background: #f8fbff;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #eef6ff;
        }

        /* 纯SVG按钮效果 */
        .svg-icon {
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="neko-ears">
        <svg width="200" height="40" viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 40 L60 10 L80 40" fill="#bde0fe" />
            <path d="M120 40 L140 10 L160 40" fill="#ffc8dd" />
        </svg>
    </div>

    <div class="header-art">
        <div class="title-group">
            <h1>NEKOMUSIC</h1>
        </div>
    </div>

    <div class="main-body">
        <div class="user-greet">
            <svg class="svg-icon" width="24" height="24" viewBox="0 0 24 24" fill="#4895ef">
                <path d="M12 2L14.5 9H22L16 13L18.5 21L12 17L5.5 21L8 13L2 9H9.5L12 2Z" />
            </svg>
            契约者大人：
        </div>

        <p style="line-height: 2; margin-top: 20px;">
            收到了来自雫酱的信号请求！为了连接至 NekoMusic 的深层网络，请执行以下序列同步。
            不要让雫酱等太久哦，不然她又要去钻被窝了喵。
        </p>

        <div class="code-card">
            <svg style="position:absolute; top:10px; left:10px;" width="30" height="30" viewBox="0 0 100 100">
                <circle cx="20" cy="20" r="10" fill="#ffc8dd" />
            </svg>

            <span style="font-size: 11px; color: #a2d2ff; letter-spacing: 3px; display:block; margin-bottom: 10px;">-- AUTHENTICATION CODE --</span>
            <div class="code-display">{{verificationCode}}</div>

            <div style="font-size: 12px; color: #bde0fe; margin-top: 15px;">
                该密钥将在 300 秒后随音符消散
            </div>
        </div>

        <p style="font-size: 13px; color: #9bb1c4; border-left: 4px solid #bde0fe; padding-left: 15px;">
            提示：若非本人请求，请将此讯号视为虚空的低语。
        </p>
    </div>

    <div class="footer-info">

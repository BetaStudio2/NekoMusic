# =============================================
# Neko云音乐后端 —— 启动引导配置
# =============================================
# 这里只保留「连上数据库之前就必须知道」的信息。
# 其余运行时配置（端口、Redis、JWT、邮件、频率限制、网络与安全、视频渲染、支付等）
# 一律放在主库的 system_settings 表，由管理后台「系统设置」页维护，改完即时生效。
#
# 首次启动时：若 system_settings 表为空，会用本文件里的值（缺省则用出厂默认值）灌一次，
# 之后以表里的值为准；本文件里对应项即使保留也不再生效。
#
# 注意：本文件不要提交到版本库（样例模板即本文件）。

# =============================================
# MySQL 数据库配置（引导信息，必须填写）
# =============================================
mysql:
  # 数据库主机地址
  # 示例：127.0.0.1, localhost, 192.168.1.100
  host: 127.0.0.1

  # 数据库端口
  # 示例：3306 (MySQL 默认端口)
  port: 3306

  # 数据库名称
  # 示例：neko_music, music_db
  database: neko_music

  # 数据库用户名
  # 示例：root, admin, neko_user
  username: root

  # 数据库密码
  # 注意：生产环境请使用强密码
  password:

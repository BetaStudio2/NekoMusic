# =============================================
# Neko云音乐后端配置文件
# =============================================

# =============================================
# 服务器配置
# =============================================
# 运行端口
# 示例：8080, 9999, 3000
port: 65535

# 高并发调优（可选；缺省为下列值，请与 MySQL max_connections 等一起规划）
performance:
  jetty_max_threads: 800
  jetty_min_threads: 200
  jetty_idle_timeout_ms: 10000
  hikari_maximum_pool_size: 100
  hikari_minimum_idle: 50


# =============================================
# MySQL 数据库配置
# =============================================
mysql:
  # 数据库主机地址
  # 示例：127.0.0.1, localhost, 192.168.1.100
  host: 127.0.0.1

  # 数据库端口
  # 示例：3306 (MySQL 默认端口)
  port: 3306

  # 数据库名称
  # 示例：neko_music, music_db
  database: neko_music

  # 数据库用户名
  # 示例：root, admin, neko_user
  username: root

  # 数据库密码
  # 注意：生产环境请使用强密码
  password:

# =============================================
# Redis 配置
# =============================================
redis:
  # Redis 主机地址
  # 示例：127.0.0.1, localhost, 192.168.1.100
  host: 127.0.0.1

  # Redis 端口
  # 示例：6379 (Redis 默认端口)
  port: 6379

  # Lettuce 连接池上限（建议不小于 Jetty 峰值并发下会打 Redis 的线程数）
  pool_max_total: 32

  # Redis 密码
  password: 123456

# =============================================
# Hook 消息配置（可选）
# =============================================
# 用于接收系统通知和告警消息
# 插件地址：https://github.com/MinecraftNekoServer/astrbot_msg_hook
Msg:
  # Hook 服务 URL
  # 示例：http://127.0.0.1:8080, http://192.168.1.100:8080
  url: 127.0.0.1:8080

  # Hook 服务 Token
  # 用于验证请求的合法性
  token:

# =============================================
# JWT 配置
# =============================================
jwt:
  # JWT 密钥
  # 注意：生产环境请使用强随机字符串，至少 32 位
  # 示例：mySuperSecretKey123456789012345
  secret:

  # Token 过期时间（秒）
  # 示例：3600 (1小时), 86400 (24小时), 604800 (7天)
  expiration: 86400  # 24小时

# =============================================
# 邮件服务器配置
# =============================================
smtp:
  # SMTP 服务器地址
  # 常用示例：
  #   - QQ企业邮箱：smtp.exmail.qq.com
  #   - QQ邮箱：smtp.qq.com
  #   - Gmail：smtp.gmail.com
  #   - 163邮箱：smtp.163.com
  host:

  # SMTP 服务器端口
  # 常用端口：
  #   - 465 (SSL)
  #   - 587 (TLS)
  #   - 25 (不加密，不推荐)
  port: 465

  # SMTP 用户名
  # 通常是完整的邮箱地址
  # 示例：support@nekocore.cn, admin@example.com
  username: support@nekocore.cn

  # SMTP 密码
  # 注意：某些邮箱需要使用授权码而非登录密码
  password:

  # 是否启用 SSL
  # 示例：true (推荐), false
  ssl: true

  # 是否启用 TLS
  # 示例：true, false
  tls: false

# =============================================
# 邮箱白名单配置
# =============================================
# 只允许这些邮箱域名的用户注册
# 留空表示允许所有邮箱域名注册
whitelist_email:
  - qq.com
  - gmail.com
  - 163.com
  - 139.com
  - 126.com
  - outlook.com
  - hotmail.com

# =============================================
# IP 频率限制配置（安全防护）
# =============================================
# 按 /24 网段进行限制，防止暴力攻击
# 示例：192.168.1.100 和 192.168.2.50 属于同一网段 192.168.0.0/24
rate_limit:
  # 是否启用 IP 频率限制
  # 示例：true (启用), false (禁用)
  enabled: true

  # 时间窗口（秒）
  # 在此时间窗口内统计请求数，超过限制后封锁网段
  # 示例：60 (1分钟), 300 (5分钟), 3600 (1小时)
  time_window: 60

  # 最大请求数
  # 同一 /24 网段在时间窗口内的最大请求次数
  # 示例：10, 20, 50
  # 建议：生产环境设置为 10-20，开发环境可设为 100
  max_requests: 300

  # 封锁时间（秒）
  # 超过限制后，该网段将被封锁的时间
  # 示例：3600 (1小时), 7200 (2小时), 86400 (1天)
  block_duration: 1200

  # 是否静默超时
  # true: 对超频请求不返回任何响应，让对方自己 timeout（更安全）
  # false: 返回错误信息给用户
  # 示例：true (推荐), false
  silent_timeout: false

# =============================================
# 网络与安全（客户端 IP 来源 / 防爬）
# =============================================
# trusted_client_ip_header：后端从哪个头还原真实客户端 IP。
#   auto                 —— 默认值。适配「CDN 经常换、各家头不一样」：依次尝试 CDN 专用单值头
#                           （CF-Connecting-IP / True-Client-IP / Ali-CDN-Real-IP / X-Edge-Real-IP /
#                           Fastly-Client-IP / X-Client-IP / X-Azure-ClientIP），再退到
#                           X-Forwarded-For（会自动摘掉本机 Nginx 用 $proxy_add_x_forwarded_for
#                           追加的回源地址那一格），最后退到 X-Real-IP 与 socket 对端。
#                           不需要维护 CDN 回源 IP 段，换 CDN 也不用改配置。
#                           注意：auto 只有在直连来源是回环 / 内网地址（即确实经过你自己的反向代理）
#                           时才信任转发头；后端被公网直连时一律使用对端地址。
#   X-Real-IP            —— 只信该头（Nginx 反代：由 proxy_set_header X-Real-IP $remote_addr 覆盖写入）。
#                           源站可被公网直连、或需要最严格的防伪造时选它。
#   direct / (留空)      —— 纯直连公网、无反向代理：一律用 socket 对端地址，忽略所有转发头，
#                          彻底杜绝评论归属地(geo)被伪造与限流被拆桶绕过，最安全。
#   X-Forwarded-For      —— 只信该头（取最右一格）。
#   CF-Connecting-IP     —— 只信 Cloudflare 的头。
# 说明：auto 为了兼容各家 CDN 必须信任转发头，因此源站若能被公网直连，归属地 / 限流仍可被伪造，
#       这种情况下请改回 X-Real-IP 或 direct。
# 重要：评论归属地、IP 限流、歌词、支付、听歌识曲全部共用该来源，改完重启生效。
network:
  trusted_client_ip_header: auto

  # extra_client_ip_headers：仅 auto 模式生效。额外登记「优先尝试」的自定义客户端 IP 头名
  #   （内置清单已覆盖 Cloudflare / Akamai / 阿里云 / 腾讯云 / Fastly / Azure / AWS 等常见 CDN）。
  #   当你换了清单之外的新 CDN、其专用头不在内置清单里时，把该头名加到这里即可，无需改代码或发版。
  #   例：
  #     extra_client_ip_headers:
  #       - "X-My-Cdn-Real-IP"
  extra_client_ip_headers: []

  # 是否启用 /api 接口的保守防爬拦截：
  # 拦截 UA 明确为爬虫/无头浏览器/命令行工具的请求访问 JSON 接口并返回 403；
  # 不影响浏览器与安卓/PC 原生客户端；ZPay 异步通知自动豁免。
  # 示例：true (启用), false (关闭)
  crawler_protection_enabled: true

  # 浏览器完整性区分拦截（在关键词黑名单之上，专门拦截未知 / 小众爬虫与安全扫描器）：
  # 对「非放行名单、非原生客户端」的 /api 请求，要求 UA 结构自洽（含 Mozilla/ 与渲染引擎标记，
  # 如 AppleWebKit/+Chrome/、Gecko/+Firefox/）且带浏览器特征头（Accept 且 Accept-Language 或 Sec-Fetch-*），
  # 否则返回 403。用于挡住自定义 UA、残缺/仅伪造 Mozilla 前缀的抓取脚本。
  # 示例：true (启用，推荐), false (仅保留关键词黑名单)
  browser_integrity_enabled: true

  # 额外放行的客户端 UA 子串（大小写不敏感，至少 6 个字符）。用于登记官方客户端之外的
  # 第三方客户端；登记项优先于爬虫 / 扫描器黑名单判定，因此请写足够具体、不易被蹭的串。示例：
  #   allow_client_user_agents:
  #     - "MyThirdPartyClient/"
  allow_client_user_agents: []

# =============================================
# 验证码发信限流
# =============================================
verification_code:
  # 同一邮箱两次发码之间的最短间隔（秒）
  email_cooldown_seconds: 60

# =============================================
# 横屏短视频渲染（FFmpeg，独立线程池异步执行）
# 用户在播放页发起「生成分享视频」，服务端异步合成 1920×1080 MP4（封面 + 标题/艺术家字幕）。
# 临时目录（tmpfs）：/tmp/.neko/video-render/{jobId}.mp4、ass/{jobId}.ass；内嵌字体/FFmpeg/水印亦在此树下
# 公开 API（需登录）：
#   POST /api/video/render/create   body: { "musicId": 1, "startSec": 0 }
#   GET  /api/video/render/{jobId}    轮询 pending → processing → done / failed
#   GET  /api/video/render/{jobId}/download
# 会员策略：
#   非 VIP：最长 non_vip_max_duration_sec 秒、带 watermark_text 水印、每日 non_vip_daily_limit 次（Redis 计数）
#   VIP：整首时长（从 startSec 到曲末）、无水印、不限次数
# 内嵌 FFmpeg：JAR 内 resources/native/linux-x86_64/ffmpeg（BtbN linux64-gpl 构建，含 NVENC/CUDA；mvn 在 Linux x86_64 上会自动下载）
video_render:
  # 是否启用视频生成功能
  # 示例：true (启用), false (关闭，接口返回 503)
  enabled: true

  # 渲染管线：
  #   cuda_native — 与 cpu_legacy 相同滤镜（圆形封面、封面外径向频谱条等），成片固定 h264_nvenc（须 NVIDIA 与 NVENC）。
  #   cpu_legacy  — 同上滤镜图，video_codec 可选 libx264 或 h264_nvenc。
  pipeline: cuda_native

  # FFmpeg 可执行文件路径
  # auto 或 ffmpeg：自动解析（优先 JAR 内嵌 → /usr/bin/ffmpeg 等）
  # 也可填绝对路径，例如 /usr/bin/ffmpeg
  ffmpeg_path: auto

  # 为 true 时优先使用 JAR 内嵌 FFmpeg；cuda_native 全 GPU 时须 false，使用带 NVENC 的系统 FFmpeg
  prefer_bundled_ffmpeg: true

  # 仅 cpu_legacy 生效：libx264（CPU）或 h264_nvenc（GPU 编码但滤镜仍在 CPU）
  # cuda_native 下固定使用 h264_nvenc，此项被忽略
  video_codec: h264_nvenc

  # 非 VIP 单次成片最长秒数（VIP 不受此项限制，按歌曲剩余时长）
  # 示例：15, 30
  non_vip_max_duration_sec: 30

  # 非 VIP 每自然日（东八区）最多生成次数，依赖 Redis
  # 示例：10, 20
  non_vip_daily_limit: 10

  # 后台渲染线程数（队列满时新任务返回 503）
  # 示例：1, 2, 4
  worker_threads: 20

  # 成片与 ASS 在 /tmp/.neko 中的保留时间（小时），到期自动删除；Redis 任务元数据 TTL 与此一致
  artifact_retention_hours: 3

  # 渲染完成邮件中的下载页站点根（不含尾斜杠），如 https://music.nekocore.cn
  # 未填则从 zpay.frontend_return_url 推断（去掉 /vip）
  notify_frontend_base_url: "https://music.nekocore.cn"

# =============================================
# ZPay 支付（易支付兼容 API，文档 https://z-pay.cn/doc.html）
# =============================================
# return_url：未填 frontend_return_url 时默认为 public_base_url + /vip
zpay:
  enabled: true
  pid: ""
  key: ""
  mapi_url: "https://zpayz.cn/mapi.php"
  public_base_url: ""
  frontend_return_url: "https://music.nekocore.cn/vip"

# =============================================
# 运行目录磁盘保护
# =============================================
# 检测 user.dir 所在分区可用空间；低于阈值时禁止音乐上传与网易云自动补全入库
storage:
  min_free_gb: 3

# =============================================
# 单曲搜索网易云补全（本地无结果时）
# =============================================
# 仅在 POST /api/music/search 本地曲库返回 0 条时触发：
# 后端直接请求网易云官方接口搜索 → 下载到临时目录 → 走管理员入库校验与落盘。
netease_search_fill:
  # 是否启用（false 时行为与原来一致）
  enabled: true
  # 可选：网易云 Cookie（Hi-Res/无损需有效登录态；留空则以游客态请求）
  cookie: ""
  # 优先下载音质（与 /song/url/v1 的 level 一致）；若无该档则自动降档直至可用
  quality: "hires"
  # 入库语言：留空或 auto=按歌名/歌手/专辑/歌词自动推断；也可写死如 英文、日语
  language: ""
  upload_user_id: null
  # HTTP 超时（秒）
  http_timeout_seconds: 45
  # 批量搜索中网易云补全的全局最大并发数，范围 1-10
  max_parallel_fills: 10

# =============================================
# 每日推荐 AI（OpenAI 兼容接口）
# =============================================
# 用于“每日推荐”场景下按用户风格做重排/解释生成；兼容 OpenAI Chat Completions 格式。
# 推荐在服务端离线任务中调用，不建议前端直连。
recommendation_ai:
  # 是否启用 AI 推荐（false 时可回退为规则排序）
  enabled: true
  # OpenAI 兼容 API Base URL（不要带尾斜杠）
  # 官方示例: https://api.openai.com/v1
  base_url: "http://ai.nekocore.cn/v1"
  # API Key
  api_key: ""
  # 模型名称（可填 gpt-4o-mini / gpt-4.1-mini 等 OpenAI 兼容模型）
  model: "gemini-3.6-Flash"
  # 生成参数
  temperature: 0.3
  top_p: 0.9
  max_tokens: 8000
  # HTTP 超时（秒）
  timeout_seconds: 60
  # 每个用户每日产出的推荐条数（最终仍需过滤用户已收藏歌曲）
  daily_limit: 300
  # 当 AI 请求失败时，是否自动回退到规则推荐
  fallback_to_rule: true

# =============================================
# 本地听歌识曲（仅匹配本站曲库，不调用第三方 API）
# =============================================
# 客户端上传 3~20 秒录音到 /api/music/recognize；服务端使用本地 FFmpeg 与 Java 声纹索引匹配。
music_recognition:
  enabled: true
  max_upload_bytes: 8388608
  min_sample_duration_seconds: 3
  max_sample_duration_seconds: 20
  index_max_track_duration_seconds: 900
  # 首次构建或新增歌曲时并行生成声纹；建议按 CPU 和内存调整，允许 1~16
  index_build_threads: 8
  minimum_matching_landmarks: 6
  minimum_confidence: 0.08
  rate_limit_per_minute: 12
  max_concurrent_requests: 2
  index_build_wait_seconds: 30
  index_refresh_seconds: 300
  ffmpeg_timeout_seconds: 45
  index_ffmpeg_timeout_seconds: 180

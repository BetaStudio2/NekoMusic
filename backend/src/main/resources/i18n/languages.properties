# NekoMusic 语言注册表：一行一门语言，用 | 分隔，是「本站有哪些语言」的唯一清单。
# 格式：标签|自称|Accept-Language 匹配前缀（小写，逗号分隔，最长前缀优先）|缺译文时的回落语言
# 标签与 resources/i18n/messages_<标签>.properties 一一对应（'-' 在文件名里写成 '_'）。
# 加一门语言：放好文案表，再在这里加一行，代码不用改。
# 回落语言留空表示直接回落源语言（zh-CN）；zh-CN 是源语言，自身不需要回落。

zh-CN|简体中文|zh,zh-hans,zh-cn,zh-sg,zh-my|
zh-TW|繁體中文|zh-hant,zh-tw,zh-mo|zh-CN
zh-HK|繁體中文（香港）|zh-hk|zh-TW
en|English|en|
ja|日本語|ja|en
ko|한국어|ko|en

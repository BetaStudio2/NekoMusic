<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NekoMusic - 分享视频已生成</title>
    <style>
        body {
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .container {
            max-width: 580px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 40px 10px 40px 10px;
            border: 2px solid #a2d2ff;
            box-shadow: 0 20px 60px rgba(162, 210, 255, 0.3);
            overflow: hidden;
            position: relative;
        }

        .header-art {
            background: linear-gradient(135deg, #c4b5fd 0%, #8b5cf6 100%);
            height: 120px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neko-ears {
            position: absolute;
            top: -20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .title-group h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            font-weight: 900;
        }

        .main-body {
            padding: 40px;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 30L35 25L30 20L25 25Z' fill='%23c4b5fd' fill-opacity='0.2'/%3E%3C/svg%3E");
            color: #5b7083;
        }

        .user-greet {
            font-size: 18px;
            color: #7c3aed;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .music-card {
            margin: 24px 0;
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            border: 1px solid #ede9fe;
            box-shadow: inset 0 0 20px rgba(196, 181, 253, 0.15), 0 10px 20px rgba(0,0,0,0.04);
        }

        .music-title {
            font-size: 20px;
            color: #5b7083;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .music-artist {
            font-size: 14px;
            color: #9bb1c4;
            margin-bottom: 12px;
        }

        .duration-tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            background: #f5f3ff;
            color: #7c3aed;
            font-size: 13px;
            font-weight: bold;
        }

        .download-btn-wrap {
            text-align: center;
            margin: 28px 0 16px;
        }

        .download-btn {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.35);
        }

        .download-link-text {
            font-size: 12px;
            color: #9bb1c4;
            word-break: break-all;
            line-height: 1.6;
            margin-top: 12px;
        }

        .watermark-note {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 14px 16px;
            margin: 20px 0 0;
            text-align: left;
            border-radius: 0 10px 10px 0;
            font-size: 13px;
            color: #92400e;
            line-height: 1.7;
        }

        .tips {
            font-size: 13px;
            color: #9bb1c4;
            border-left: 4px solid #c4b5fd;
            padding-left: 15px;
            margin-top: 24px;
            line-height: 1.8;
        }

        .footer-info {
            background: #f8fbff;
            padding: 24px 30px;
            text-align: center;
            border-top: 1px solid #eef6ff;
            font-size: 12px;
            color: #9bb1c4;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="neko-ears">
        <svg width="200" height="40" viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 40 L60 10 L80 40" fill="#c4b5fd" />
            <path d="M120 40 L140 10 L160 40" fill="#a78bfa" />
        </svg>
    </div>

    <div class="header-art">
        <div class="title-group">
            <h1>分享视频已生成</h1>
        </div>
    </div>

    <div class="main-body">
        <div class="user-greet">您好，您请求的横屏分享视频已渲染完成。</div>

        <div class="music-card">
            <div class="music-title">《{{musicName}}》</div>
            <div class="music-artist">{{artistName}}</div>
            <span class="duration-tag">时长约 {{durationSec}} 秒</span>
        </div>

        <div class="download-btn-wrap">
            <a class="download-btn" href="{{downloadUrl}}">前往下载 MP4</a>
            <div class="download-link-text">若按钮无法点击，请复制以下链接到浏览器打开：<br>{{downloadUrl}}</div>
        </div>

        <div class="watermark-note" style="{{showWatermarkNote}}">
            本视频含平台水印。开通 VIP 可生成无水印、整首时长的分享视频。
        </div>

        <div class="tips">
            请使用创建任务时登录的 NekoMusic 账号访问下载链接。<br>
            生成时间：{{completedAt}}
        </div>
    </div>

    <div class="footer-info">
        NekoMusic · 此邮件由系统自动发送，请勿直接回复
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NekoMusic - 网易云歌词校验失败</title>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; margin: 0; padding: 24px; color: #333; }
        .box { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        h2 { margin: 0 0 8px; color: #c0392b; }
        .meta { color: #666; font-size: 14px; margin-bottom: 16px; }
        .label { font-weight: 600; margin-top: 16px; }
        pre { background: #f8f9fa; border: 1px solid #e1e4e8; border-radius: 8px; padding: 12px; white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.5; }
        .reason { color: #c0392b; }
        .foot { margin-top: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
<div class="box">
    <h2>网易云自动爬虫 · 歌词 LRC 校验失败</h2>
    <p class="meta">歌曲已使用占位歌词继续入库。下方为网易云 /lyric 接口返回的 <strong>lrc</strong> 字段原文。</p>
    <p><strong>歌曲：</strong>{{title}} — {{artist}}</p>
    <p><strong>曲库 ID：</strong>{{musicId}}（已入库完成）</p>
    <p><strong>网易云 ID：</strong>{{songId}}</p>
    <p class="label">校验失败原因</p>
    <p class="reason">{{reason}}</p>
    <p class="label">lrc 原文</p>
    {{lyricsBlock}}
    <p class="foot">通知时间：{{notifiedAt}} · NekoMusic 后端</p>
</div>
</body>
</html>

services:
  neko-music:
    container_name: NekoMusic

    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        NEKO_WEB_VERSION: ${NEKO_WEB_VERSION:-dev}

    restart: on-failure:5
    network_mode: host
    gpus: all

    environment:
      LANG: C.UTF-8
      LANGUAGE: C.UTF-8
      LC_ALL: C.UTF-8

    volumes:
      - type: bind
        source: "${NEKO_DATA_DIR:-.}"
        target: /app